name: Refresh KBO schedule

on:
  schedule:
    # 매일 15:30 UTC = 00:30 KST(다음날). 그날 경기가 대부분 종료된 직후 최신 결과를 반영한다.
    - cron: "30 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run fetch:kbo

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kbo-cache src/data/kbo-schedule.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: KBO 일정/결과 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[승요 판독기] KBO 데이터 갱신 실패"
          to: zzznd3@gmail.com
          from: 승요 판독기 봇 <${{ secrets.MAIL_USERNAME }}>
          body: |
            KBO 일정 갱신 워크플로가 실패했습니다.
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
